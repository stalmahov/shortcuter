# Локальный запуск: docker compose up --build.
# Значения — только из .env (см. .env.example), в репо секретов нет.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      # 5433: на хосте 5432 занят локальным postgres.exe, не конфликтуем
      - "5433:5432" # локальная разработка и тесты без докера внутри
    volumes:
      - ./services/db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
    depends_on:
      - app
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
