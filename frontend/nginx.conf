server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }
}
